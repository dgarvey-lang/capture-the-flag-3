<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Systems of Equations Worksheet</title>
<style>
:root{
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#f3f5f8; --surface:#ffffff; --text:#1b2430; --muted:#5b6778; --border:#d3dae4;
  --accent:#0f6f8c; --accent-text:#ffffff; --accent-soft:#e3f2f7;
  --ok:#1b8a4b; --okbg:#e5f6ec; --bad:#c23a3a; --badbg:#fbe9e9;
  --blue:#1f6fd6; --red:#d6402f; --green:#1b8a4b; --gold:#e0a800;
  --grid:#e3e8ef; --axis:#7d8896; --canvasbg:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#12171d; --surface:#1b222b; --text:#e8edf3; --muted:#9aa7b8; --border:#33404f;
    --accent:#4cb8d6; --accent-text:#0b1a20; --accent-soft:#1c3440;
    --ok:#52c985; --okbg:#173325; --bad:#ff7b7b; --badbg:#3a1d1f;
    --blue:#5aa2ff; --red:#ff7b6b; --green:#52c985; --gold:#f2c230;
    --grid:#2a3441; --axis:#8795a6; --canvasbg:#161d25;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#12171d; --surface:#1b222b; --text:#e8edf3; --muted:#9aa7b8; --border:#33404f;
  --accent:#4cb8d6; --accent-text:#0b1a20; --accent-soft:#1c3440;
  --ok:#52c985; --okbg:#173325; --bad:#ff7b7b; --badbg:#3a1d1f;
  --blue:#5aa2ff; --red:#ff7b6b; --green:#52c985; --gold:#f2c230;
  --grid:#2a3441; --axis:#8795a6; --canvasbg:#161d25;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:18px; line-height:1.5;
}
main{max-width:860px; margin:0 auto; padding:24px 20px 60px}
h1{font-size:2em; line-height:1.15; margin:0 0 .3em}
h2{font-size:1.3em; margin:0 0 .4em; line-height:1.2}
p{margin:.5em 0}
.lead{font-size:1.1em}
.muted{color:var(--muted)}
.btn{font:inherit; font-size:.92em; color:var(--text); background:var(--surface); border:2px solid var(--border); border-radius:8px; padding:7px 16px; cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:default}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-text); font-weight:600}
.btn.armed{border-color:var(--bad); color:var(--bad); font-weight:600}
.fld{font:inherit; color:var(--text); background:var(--surface); border:2px solid var(--border); border-radius:8px; padding:4px 8px; margin:2px 3px; max-width:100%}
input.fld{text-align:center}
.fld:focus{outline:3px solid var(--accent-soft); border-color:var(--accent)}
.fld.ok{border-color:var(--ok); background:var(--okbg)}
.fld.bad{border-color:var(--bad); background:var(--badbg)}
.fld:disabled{opacity:1}
.progress{position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; border-bottom:1px solid var(--border); margin-bottom:18px}
.bar{height:10px; background:var(--accent-soft); border-radius:5px; overflow:hidden; margin-top:6px}
.bar span{display:block; height:100%; width:0; background:var(--ok); transition:width .4s}
.note{padding:12px 16px; border-left:4px solid var(--accent); background:var(--accent-soft); border-radius:6px; margin:14px 0}
.prob{background:var(--surface); border:1px solid var(--border); border-left:6px solid var(--border); border-radius:14px; padding:20px 24px; margin-bottom:18px}
.prob.done{border-left-color:var(--ok)}
.prob.helped{border-left-color:var(--gold)}
.phead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.status{font-size:.85em; font-weight:600; color:var(--muted)}
.status.good{color:var(--ok)} .status.helped{color:var(--muted)}
.sysbox{display:inline-block; border:1px solid var(--border); border-radius:10px; padding:8px 22px; margin:6px 0 10px; background:var(--bg)}
.eq{font-size:1.2em; font-weight:600; padding:2px 0}
.row{margin:10px 0}
.eqs{font-weight:600; white-space:nowrap}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; align-items:center}
.msg{margin-top:12px; min-height:1.5em; color:var(--muted)}
.msg.good{color:var(--ok); font-weight:600}
.msg.warn{color:var(--bad); font-weight:600}
.hbody{margin-top:14px; padding:14px 18px; border-left:4px solid var(--accent); background:var(--accent-soft); border-radius:6px}
.hbody[hidden]{display:none}
.hbody p, .hbody ol{margin:.4em 0}
.gtools{display:flex; justify-content:space-between; align-items:center; max-width:460px; font-size:.9em; color:var(--muted); margin-top:6px}
.gtools .dot{display:inline-block; width:12px; height:12px; border-radius:50%; margin:0 4px 0 10px; vertical-align:-1px}
.gtools .dot:first-child{margin-left:0}
.gtools .gcoord{font-weight:700; color:var(--text)}
.hcanvas{width:100%; max-width:340px; aspect-ratio:1/1; display:block; border:2px solid var(--border); border-radius:10px; background:var(--canvasbg); margin-top:10px}
.gin{max-width:460px; cursor:crosshair; touch-action:manipulation}
.gin.ok{border-color:var(--ok)} .gin.bad{border-color:var(--bad)}
.end{background:var(--surface); border:2px solid var(--accent); border-radius:14px; padding:22px 26px; margin-top:26px}
.rt{width:100%; border-collapse:collapse; font-size:.92em; margin:10px 0}
.rt th,.rt td{padding:6px 10px; border-bottom:1px solid var(--border); text-align:left}
.rt th{color:var(--muted); font-size:.8em; text-transform:uppercase; letter-spacing:.04em}
@media (max-width:620px){ body{font-size:16px} main{padding:16px 16px 50px} .prob,.end{padding:16px} }
</style>
</head>
<body>
<main>
  <h1>3-1 Practice: Solving Systems of Equations</h1>
  <p class="lead">Work through each problem. Press <b>Check answer</b> when you’re done. If you get stuck, <b>Help</b> gives a hint first, and pressing it again shows the full solution.</p>
  <div class="progress">
    <span id="progText"></span>
    <div class="bar"><span id="progBar"></span></div>
  </div>
  <div id="problems"></div>
  <section class="end">
    <h2>Your progress</h2>
    <p id="sumText"></p>
    <div style="overflow-x:auto"><table class="rt"><thead><tr><th>Problem</th><th>Worksheet</th><th>Result</th></tr></thead><tbody id="sumRows"></tbody></table></div>
    <div class="actions"><button class="btn primary" id="restartBtn" type="button">↻ Restart worksheet</button></div>
  </section>
</main>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function fmt(n){ n = Math.round(n*1e6)/1e6; return n < 0 ? '−' + (-n) : String(n); }
function norm(s){ return String(s).toLowerCase().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/[()]/g,''); }
function numOf(s){
  s = norm(s); if(s === '') return NaN;
  if(/^-?\d*\.?\d+$/.test(s)) return parseFloat(s);
  var m = /^(-?\d+)\/(\d+)$/.exec(s); if(m && +m[2] !== 0) return (+m[1])/(+m[2]);
  return NaN;
}
function near(sv, target, tol){ var v = numOf(sv); return !isNaN(v) && Math.abs(v - target) < tol; }
function pairText(p){ return '(' + fmt(p[0]) + ', ' + fmt(p[1]) + ')'; }
function term(c, v){ var a = Math.abs(c); return a === 1 ? '(' + v + ')' : a + '(' + v + ')'; }
function expr(a, b, x, y){
  var s = '';
  [[a,x],[b,y]].forEach(function(p){
    var c = p[0]; if(c === 0) return;
    var body = term(c, fmt(p[1]));
    if(s === '') s = (c < 0 ? '−' : '') + body; else s += (c < 0 ? ' − ' : ' + ') + body;
  });
  return s;
}
/* ================= question bank (from the 3-1 worksheet) ================= */
var TYPE_NAME = {one:'One solution', none:'No solution', inf:'Infinite solutions'};
var Q = [
  {id:'1a', ref:'1', kind:'pair', pt:[10,6], eqs:[{t:'x + y = 16',a:1,b:1,c:16},{t:'y − x = 2',a:-1,b:1,c:2}]},
  {id:'1b', ref:'1', kind:'pair', pt:[3,4],  eqs:[{t:'x + y = 16',a:1,b:1,c:16},{t:'y − x = 2',a:-1,b:1,c:2}]},
  {id:'2a', ref:'2', kind:'pair', pt:[10,6], eqs:[{t:'3x − y = 5',a:3,b:-1,c:5},{t:'x + 2y = 11',a:1,b:2,c:11}]},
  {id:'2b', ref:'2', kind:'pair', pt:[3,4],  eqs:[{t:'3x − y = 5',a:3,b:-1,c:5},{t:'x + 2y = 11',a:1,b:2,c:11}]},
  {id:'3',  ref:'3', kind:'pair', pt:[3,-2], eqs:[{t:'x + 7y = 25',a:1,b:7,c:25},{t:'5x + y = 11',a:5,b:1,c:11}]},
  {id:'4',  ref:'4', kind:'pair', pt:[0,6],  eqs:[{t:'−2x − 5y = −30',a:-2,b:-5,c:-30},{t:'−4x + 4y = 24',a:-4,b:4,c:24}]},
  {id:'5', ref:'5', kind:'graph', eqs:['2y − 2x = −14','9 = 7x + y'], lines:[{m:1,b:-7},{m:-7,b:9}], type:'one', sol:[2,-5],
   steps:'<li>2y − 2x = −14 → add 2x: 2y = 2x − 14 → divide by 2: <b>y = x − 7</b></li><li>9 = 7x + y → subtract 7x: <b>y = −7x + 9</b></li><li>The slopes are different (1 and −7), so the lines cross once. Set them equal: x − 7 = −7x + 9, so 8x = 16 and x = 2. Then y = 2 − 7 = −5.</li>'},
  {id:'6', ref:'6', kind:'graph', eqs:['2 = x − y','−8x − y = −7'], lines:[{m:1,b:-2},{m:-8,b:7}], type:'one', sol:[1,-1],
   steps:'<li>2 = x − y → add y and subtract 2: <b>y = x − 2</b></li><li>−8x − y = −7 → add 8x: −y = 8x − 7 → multiply by −1: <b>y = −8x + 7</b></li><li>Different slopes (1 and −8), so one solution. Set equal: x − 2 = −8x + 7, so 9x = 9 and x = 1. Then y = 1 − 2 = −1.</li>'},
  {id:'7', ref:'7', kind:'graph', eqs:['y = 5','2x − y = 1'], lines:[{m:0,b:5},{m:2,b:-1}], type:'one', sol:[3,5],
   steps:'<li>y = 5 is already solved: slope <b>0</b>, y-intercept <b>5</b> (a flat line).</li><li>2x − y = 1 → subtract 2x: −y = −2x + 1 → multiply by −1: <b>y = 2x − 1</b></li><li>Different slopes, so one solution. Put y = 5 into the second line: 5 = 2x − 1, so x = 3.</li>'},
  {id:'8', ref:'8', kind:'graph', eqs:['y = 3x − 2','15x − 5y = 10'], lines:[{m:3,b:-2},{m:3,b:-2}], type:'inf',
   steps:'<li>y = 3x − 2 is already solved: slope <b>3</b>, y-intercept <b>−2</b>.</li><li>15x − 5y = 10 → subtract 15x: −5y = −15x + 10 → divide by −5: <b>y = 3x − 2</b></li><li>Both equations are exactly the same line, so every point on the line is a solution: infinitely many.</li>'},
  {id:'9', ref:'9', kind:'graph', eqs:['x − 2y = −6','y = (1/2)x − 8'], lines:[{m:0.5,b:3},{m:0.5,b:-8}], type:'none',
   steps:'<li>x − 2y = −6 → subtract x: −2y = −x − 6 → divide by −2: <b>y = (1/2)x + 3</b></li><li>y = (1/2)x − 8 is already solved: slope <b>1/2</b>, y-intercept <b>−8</b>.</li><li>Same slope (1/2) but different y-intercepts (3 and −8), so the lines are parallel and never meet: no solution.</li>'},
  {id:'10', ref:'10', kind:'graph', eqs:['3x − 5y = 20','y = 10x − 4'], lines:[{m:0.6,b:-4},{m:10,b:-4}], type:'one', sol:[0,-4],
   steps:'<li>3x − 5y = 20 → subtract 3x: −5y = −3x + 20 → divide by −5: <b>y = (3/5)x − 4</b></li><li>y = 10x − 4 is already solved: slope <b>10</b>, y-intercept <b>−4</b>.</li><li>Different slopes, so one solution. Both lines have y-intercept −4, so they cross on the y-axis at (0, −4).</li>'},
  {id:'11', ref:'11', kind:'graph', eqs:['y = (1/4)x + 1','y = (5/4)x − 3'], lines:[{m:0.25,b:1},{m:1.25,b:-3}], type:'one', sol:[4,2],
   steps:'<li>Both equations are already in slope-intercept form: slopes <b>1/4</b> and <b>5/4</b>, y-intercepts <b>1</b> and <b>−3</b>.</li><li>Different slopes, so one solution. Set equal: (1/4)x + 1 = (5/4)x − 3, so 4 = x. Then y = (1/4)(4) + 1 = 2.</li>'},
  {id:'12', ref:'12', kind:'graph', eqs:['x − 4y = −4','y = (1/4)x − 2'], lines:[{m:0.25,b:1},{m:0.25,b:-2}], type:'none',
   steps:'<li>x − 4y = −4 → subtract x: −4y = −x − 4 → divide by −4: <b>y = (1/4)x + 1</b></li><li>y = (1/4)x − 2 is already solved: slope <b>1/4</b>, y-intercept <b>−2</b>.</li><li>Same slope (1/4), different y-intercepts (1 and −2): parallel lines, no solution.</li>'},
  {id:'13', ref:'13', kind:'graph', eqs:['y = (1/3)x + 3','4x − 12y = −36'], lines:[{m:1/3,b:3},{m:1/3,b:3}], type:'inf',
   steps:'<li>y = (1/3)x + 3 is already solved: slope <b>1/3</b>, y-intercept <b>3</b>.</li><li>4x − 12y = −36 → subtract 4x: −12y = −4x − 36 → divide by −12: <b>y = (1/3)x + 3</b></li><li>Same line, so there are infinitely many solutions.</li>'}
];

function pairSolutionHtml(q){
  var truth = q.eqs.every(function(e){ return e.a*q.pt[0] + e.b*q.pt[1] === e.c; });
  var h = '<p><b>Plug in '+pairText(q.pt)+':</b></p><ol>';
  q.eqs.forEach(function(e){
    var v = e.a*q.pt[0] + e.b*q.pt[1];
    h += '<li>'+e.t+' → '+expr(e.a, e.b, q.pt[0], q.pt[1])+' = <b>'+fmt(v)+'</b>. Compare with '+fmt(e.c)+': <b>'+(v === e.c ? 'TRUE' : 'FALSE')+'</b></li>';
  });
  h += '</ol><p>' + (truth ? 'Both equations are true, so '+pairText(q.pt)+' <b>is</b> a solution.' : 'At least one equation is false, so '+pairText(q.pt)+' is <b>NOT</b> a solution.') + '</p>';
  return h;
}
function drawBoard(cv, q, o){
  if(!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d'); if(!ctx) return;
  var size = cv.clientWidth || 300, dpr = window.devicePixelRatio || 1;
  cv.width = cv.height = Math.round(size*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var L = 11, sc = size/(2*L);
  function X(x){ return (x+L)*sc; } function Y(y){ return (L-y)*sc; }
  var cs = getComputedStyle(document.documentElement);
  function css(n){ return cs.getPropertyValue(n).trim(); }
  ctx.clearRect(0,0,size,size);
  ctx.lineWidth = 1; ctx.strokeStyle = css('--grid');
  for(var i = -10; i <= 10; i++){
    ctx.beginPath(); ctx.moveTo(X(i),0); ctx.lineTo(X(i),size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,Y(i)); ctx.lineTo(size,Y(i)); ctx.stroke();
  }
  ctx.strokeStyle = css('--axis'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(X(0),0); ctx.lineTo(X(0),size); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,Y(0)); ctx.lineTo(size,Y(0)); ctx.stroke();
  ctx.fillStyle = css('--axis'); ctx.font = Math.max(9, size/36) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for(var t = -10; t <= 10; t += 5){ if(t !== 0) ctx.fillText(String(t).replace('-','−'), X(t), Y(0)+3); }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(var u = -10; u <= 10; u += 5){ if(u !== 0) ctx.fillText(String(u).replace('-','−'), X(0)-4, Y(u)); }
  function seg(ln, color, w, dash){
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []);
    ctx.beginPath(); ctx.moveTo(X(-L), Y(ln.m*-L + ln.b)); ctx.lineTo(X(L), Y(ln.m*L + ln.b)); ctx.stroke(); ctx.setLineDash([]);
  }
  var same = Math.abs(q.lines[0].m - q.lines[1].m) < 1e-9 && Math.abs(q.lines[0].b - q.lines[1].b) < 1e-9;
  if(o.answer){
    seg(q.lines[0], css('--blue'), same ? 6 : 3);
    seg(q.lines[1], css('--red'), same ? 2 : 3, same ? [7,6] : null);
  }
  var P = o.pts || [];
  function pseg(p1, p2, color){
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath();
    if(p1[0] === p2[0]){ ctx.moveTo(X(p1[0]), Y(-L)); ctx.lineTo(X(p1[0]), Y(L)); }
    else { var m = (p2[1]-p1[1])/(p2[0]-p1[0]); ctx.moveTo(X(-L), Y(p1[1]+m*(-L-p1[0]))); ctx.lineTo(X(L), Y(p1[1]+m*(L-p1[0]))); }
    ctx.stroke();
  }
  if(P.length >= 2) pseg(P[0], P[1], css('--blue'));
  if(P.length >= 4) pseg(P[2], P[3], css('--red'));
  ctx.font = 'bold ' + Math.max(10, size/32) + 'px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  P.forEach(function(pt, i){
    ctx.fillStyle = i < 2 ? css('--blue') : css('--red'); ctx.beginPath(); ctx.arc(X(pt[0]), Y(pt[1]), 6, 0, 6.2832); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = css('--canvasbg'); ctx.stroke();
    ctx.fillStyle = css('--text'); ctx.fillText(pairText(pt), X(pt[0]) + 9, Y(pt[1]) - 6);
  });
  if((o.answer || o.ring) && q.type === 'one'){
    ctx.strokeStyle = css('--green'); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(X(q.sol[0]), Y(q.sol[1]), 9, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = css('--text'); ctx.font = 'bold ' + Math.max(10, size/30) + 'px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(pairText(q.sol), X(q.sol[0]) + 12, Y(q.sol[1]) - 6);
  }
}

/* ================= rendering ================= */
function inp(name, w, ph){ return '<input class="fld" type="text" data-f="'+name+'" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:'+w+'ch"'+(ph?' placeholder="'+ph+'"':'')+' aria-label="'+name+'">'; }
function sysBox(list){ return '<div class="sysbox">' + list.map(function(t){ return '<div class="eq">'+t+'</div>'; }).join('') + '</div>'; }
function pairHtml(q){
  var h = '<p class="lead">Is the point <b>'+pairText(q.pt)+'</b> a solution of this system?</p>' + sysBox(q.eqs.map(function(e){ return e.t; }));
  h += '<p>Plug in x = '+fmt(q.pt[0])+' and y = '+fmt(q.pt[1])+'. Compute the <b>left side</b> of each equation:</p>';
  q.eqs.forEach(function(e, i){
    h += '<div class="row"><span class="eqs">'+e.t+'</span> → left side = ' + inp('v'+i, 6) + ' <span class="muted">(the right side is '+fmt(e.c)+')</span></div>';
  });
  h += '<div class="row">So is '+pairText(q.pt)+' a solution? <select class="fld" data-f="final" aria-label="Is it a solution"><option value="">Choose…</option><option>Yes</option><option>No</option></select></div>';
  return h;
}
function graphHtml(q){
  var h = '<p class="lead">Solve this system by graphing.</p>' + sysBox(q.eqs);
  h += '<p><b>Step 1: graph both equations.</b> Click two points on Equation 1 (blue), then two points on Equation 2 (red). Tip: solve for y first.</p>' +
    '<div class="gtools"><span><i class="dot" style="background:var(--blue)"></i>Equation 1<i class="dot" style="background:var(--red)"></i>Equation 2</span><span class="gcoord"></span></div>' +
    '<canvas class="hcanvas gin" aria-label="Coordinate grid. Click to place points for each line."></canvas>' +
    '<div class="actions" style="margin-top:8px"><button class="btn gundo" type="button">Undo point</button><button class="btn gclear" type="button">Clear graph</button></div>';
  h += '<p style="margin-top:18px"><b>Step 2: show your work.</b> Write each equation in slope-intercept form (type fractions like 1/4 or decimals):</p>';
  q.eqs.forEach(function(e, i){
    h += '<div class="row"><span class="eqs">Equation '+(i+1)+':</span> y = ' + inp('m'+i, 6, 'slope') + ' x + ' + inp('b'+i, 6, 'intercept') + '</div>';
  });
  h += '<div class="row">How many solutions? <select class="fld" data-f="type" aria-label="How many solutions"><option value="">Choose…</option><option>One solution</option><option>No solution</option><option>Infinite solutions</option></select></div>';
  h += '<div class="row">If there is one solution, write it as an ordered pair: ' + inp('sol', 9, '(  ,  )') + '</div>';
  return h;
}
function graphSolutionHtml(q){
  var ans = q.type === 'one' ? 'One solution: <b>'+pairText(q.sol)+'</b>' : '<b>'+TYPE_NAME[q.type]+'</b>';
  return '<p><b>Worked solution:</b></p><ol>' + q.steps + '</ol><p>Answer: ' + ans + '.</p><canvas class="hcanvas ans" aria-label="Graph of both lines"></canvas>';
}
function hintHtml(q){
  var warn = '<p class="muted">Press Help again to see the full solution.</p>';
  if(q.kind === 'pair') return '<p><b>Hint:</b> replace x and y with the numbers from the point, do the arithmetic, and compare each result with the right side of that equation. The point is a solution only if <b>both</b> equations come out true.</p>' + warn;
  return '<p><b>Hint:</b> solve each equation for y so it looks like y = mx + b. Then compare the lines: <b>different slopes</b> means one solution, <b>same slope but different y-intercepts</b> means no solution, and <b>the same slope and the same intercept</b> means infinite solutions.</p>' + warn;
}

/* ================= worksheet state ================= */
var CARDS = [];
function lineFrom(a, b){ if(a[0] === b[0]) return null; var m = (b[1]-a[1])/(b[0]-a[0]); return {m:m, b:a[1]-m*a[0]}; }
function field(c, name){ return c.root.querySelector('[data-f="'+name+'"]'); }
function say(c, text, cls){ c.msg.textContent = text; c.msg.className = 'msg' + (cls ? ' ' + cls : ''); }
function redraw(c){ var cv = c.root.querySelector('.gin'); if(cv) drawBoard(cv, c.q, {pts:c.pts, answer:false, ring:c.solved}); }
function drawAnswer(c){ var cv = c.root.querySelector('.hcanvas.ans'); if(cv) requestAnimationFrame(function(){ drawBoard(cv, c.q, {answer:true}); }); }

function bindGraph(c){
  var cv = c.root.querySelector('.gin'); if(!cv) return;
  function toGrid(e){
    var r = cv.getBoundingClientRect(), L = 11;
    var x = Math.round(((e.clientX - r.left)/r.width)*2*L - L), y = Math.round(L - ((e.clientY - r.top)/r.height)*2*L);
    return [Math.max(-10, Math.min(10, x)), Math.max(-10, Math.min(10, y))];
  }
  cv.addEventListener('click', function(e){
    if(c.solved) return;
    var P = c.pts, g = toGrid(e);
    if(P.length >= 4){ say(c, 'You already have 4 points. Use Undo or Clear to change them.', ''); return; }
    if(P.length % 2 === 1 && P[P.length-1][0] === g[0] && P[P.length-1][1] === g[1]) return;
    P.push(g); cv.classList.remove('ok','bad'); redraw(c);
  });
  var co = c.root.querySelector('.gcoord');
  cv.addEventListener('pointermove', function(e){ co.textContent = pairText(toGrid(e)); });
  cv.addEventListener('pointerleave', function(){ co.textContent = ''; });
  c.root.querySelector('.gundo').onclick = function(){ if(c.solved) return; c.pts.pop(); cv.classList.remove('ok','bad'); redraw(c); };
  c.root.querySelector('.gclear').onclick = function(){ if(c.solved) return; c.pts = []; cv.classList.remove('ok','bad'); redraw(c); };
  requestAnimationFrame(function(){ redraw(c); });
}

function evaluate(c){
  var q = c.q, marks = {}, allOk = true, blank = false;
  function mark(n, ok){ marks[n] = ok; if(!ok) allOk = false; }
  if(q.kind === 'pair'){
    q.eqs.forEach(function(e, i){
      var v = e.a*q.pt[0] + e.b*q.pt[1], f = field(c, 'v'+i);
      if(!f.value.trim()){ blank = true; mark('v'+i, false); } else mark('v'+i, near(f.value, v, 1e-9));
    });
    var truth = q.eqs.every(function(e){ return e.a*q.pt[0] + e.b*q.pt[1] === e.c; });
    var fin = field(c, 'final').value;
    if(!fin){ blank = true; mark('final', false); } else mark('final', (fin === 'Yes') === truth);
  } else {
    q.lines.forEach(function(Ln, i){
      [['m',Ln.m],['b',Ln.b]].forEach(function(p){
        var nm = p[0] + i, f = field(c, nm);
        if(!f.value.trim()){ blank = true; mark(nm, false); } else mark(nm, near(f.value, p[1], 0.006));
      });
    });
    var P = c.pts;
    if(P.length < 4){ blank = true; mark('graph', false); }
    else {
      var ls = [lineFrom(P[0], P[1]), lineFrom(P[2], P[3])];
      var sameLn = function(a, t){ return a && Math.abs(a.m - t.m) < 1e-9 && Math.abs(a.b - t.b) < 1e-9; };
      var uniq = q.lines.filter(function(t, i, arr){ return arr.findIndex(function(u){ return sameLn(u, t); }) === i; });
      var idx = ls.map(function(a){ return uniq.findIndex(function(t){ return sameLn(a, t); }); });
      mark('graph', idx.every(function(i){ return i >= 0; }) && uniq.every(function(t, i){ return idx.indexOf(i) >= 0; }));
    }
    var ts = field(c, 'type').value;
    if(!ts){ blank = true; mark('type', false); } else mark('type', ts === TYPE_NAME[q.type]);
    if(q.type === 'one'){
      var sf = field(c, 'sol');
      if(!sf.value.trim()){ blank = true; mark('sol', false); } else mark('sol', norm(sf.value) === q.sol[0] + ',' + q.sol[1]);
    }
  }
  Object.keys(marks).forEach(function(n){
    var f = (n === 'graph') ? c.root.querySelector('.gin') : field(c, n); if(!f) return;
    f.classList.remove('ok','bad');
    if(!blank) f.classList.add(marks[n] ? 'ok' : 'bad');
  });
  return {ok: allOk && !blank, blank: blank};
}

function setStatus(c){
  c.root.classList.toggle('done', c.solved && !c.help2);
  c.root.classList.toggle('helped', c.help2);
  var s = c.status;
  if(c.solved && !c.help2){ s.textContent = c.wrong ? '✓ Correct after ' + c.wrong + ' ' + (c.wrong === 1 ? 'try' : 'tries') : '✓ Correct on the first try'; s.className = 'status good'; }
  else if(c.help2){ s.textContent = c.solved ? '💡 Finished with the full solution' : '💡 Full solution shown'; s.className = 'status helped'; }
  else if(c.wrong){ s.textContent = c.wrong + ' wrong ' + (c.wrong === 1 ? 'try' : 'tries') + ' so far'; s.className = 'status'; }
  else { s.textContent = ''; s.className = 'status'; }
}
function onCheck(c){
  if(c.solved) return;
  var r = evaluate(c);
  if(r.blank){ say(c, c.q.kind === 'graph' ? 'Graph both lines first (2 points each) and fill in every box. The ordered pair is only needed when there is one solution.' : 'Fill in every box first.', 'warn'); return; }
  if(r.ok){
    c.solved = true;
    c.root.querySelectorAll('.fld').forEach(function(f){ f.disabled = true; });
    c.check.disabled = true;
    say(c, '✓ Correct!', 'good');
    if(c.q.kind === 'graph') redraw(c);
  } else {
    c.wrong++;
    say(c, '✗ Not quite. Fix the boxes outlined in red and check again, or press Help.', 'warn');
  }
  setStatus(c); updateProgress();
}
function onHelp(c){
  if(c.helpLevel === 0){
    c.helpLevel = 1; c.hbox.hidden = false; c.hbox.innerHTML = hintHtml(c.q);
    c.helpBtn.textContent = '💡 Show full solution';
  } else if(c.helpLevel === 1){
    c.helpLevel = 2; c.help2 = true; c.hbox.hidden = false;
    c.hbox.innerHTML = c.q.kind === 'pair' ? pairSolutionHtml(c.q) : graphSolutionHtml(c.q); drawAnswer(c);
    c.helpBtn.textContent = '💡 Hide solution';
    if(!c.solved) say(c, 'Study the solution, then fill in your answers and check them.', '');
    setStatus(c); updateProgress();
  } else {
    var hide = !c.hbox.hidden; c.hbox.hidden = hide;
    c.helpBtn.textContent = hide ? '💡 Show solution again' : '💡 Hide solution';
    if(!hide) drawAnswer(c);
  }
}

function buildCard(q, n){
  var root = el('section', 'prob');
  var head = el('div', 'phead');
  head.appendChild(el('h2', null, 'Problem ' + n + ' · worksheet #' + q.ref));
  var status = el('span', 'status'); status.setAttribute('role', 'status'); head.appendChild(status);
  root.appendChild(head);
  var body = el('div'); body.innerHTML = q.kind === 'pair' ? pairHtml(q) : graphHtml(q); root.appendChild(body);
  var acts = el('div', 'actions');
  var check = el('button', 'btn primary', 'Check answer'); check.type = 'button';
  var helpBtn = el('button', 'btn', '💡 Help'); helpBtn.type = 'button';
  acts.appendChild(check); acts.appendChild(helpBtn); root.appendChild(acts);
  var msg = el('div', 'msg'); msg.setAttribute('role', 'status'); root.appendChild(msg);
  var hbox = el('div', 'hbody'); hbox.hidden = true; root.appendChild(hbox);
  var c = {q:q, root:root, status:status, check:check, helpBtn:helpBtn, msg:msg, hbox:hbox, pts:[], helpLevel:0, help2:false, solved:false, wrong:0};
  check.onclick = function(){ onCheck(c); };
  helpBtn.onclick = function(){ onHelp(c); };
  body.addEventListener('input', function(e){ if(e.target.classList) e.target.classList.remove('ok','bad'); });
  body.addEventListener('change', function(e){ if(e.target.classList) e.target.classList.remove('ok','bad'); });
  body.addEventListener('keydown', function(e){ if(e.key === 'Enter' && e.target.tagName === 'INPUT') onCheck(c); });
  return c;
}
function buildSheet(){
  var list = $('problems'); list.textContent = '';
  CARDS = Q.map(function(q, i){ var c = buildCard(q, i + 1); list.appendChild(c.root); if(q.kind === 'graph') bindGraph(c); return c; });
  updateProgress();
}

/* ================= progress and summary ================= */
function updateProgress(){
  var total = CARDS.length, done = CARDS.filter(function(c){ return c.solved; }).length;
  var first = CARDS.filter(function(c){ return c.solved && !c.wrong && !c.help2; }).length;
  var helped = CARDS.filter(function(c){ return c.help2; }).length;
  $('progText').textContent = done + ' of ' + total + ' problems finished';
  $('progBar').style.width = (100*done/total) + '%';
  $('sumText').textContent = done === total
    ? 'You finished all ' + total + ' problems! ' + first + ' correct on the first try, ' + helped + ' with the full solution.'
    : done + ' of ' + total + ' finished so far · ' + first + ' correct on the first try · ' + helped + ' with the full solution.';
  var tb = $('sumRows'); tb.textContent = '';
  CARDS.forEach(function(c, i){
    var tr = el('tr');
    tr.appendChild(el('td', null, String(i + 1)));
    tr.appendChild(el('td', null, '#' + c.q.ref));
    tr.appendChild(el('td', null, c.status.textContent || 'Not started'));
    tb.appendChild(tr);
  });
}
function restart(){
  var btn = $('restartBtn');
  if(btn.dataset.armed === '1'){
    btn.dataset.armed = '0'; btn.classList.remove('armed'); btn.textContent = '↻ Restart worksheet';
    buildSheet(); window.scrollTo(0, 0); return;
  }
  btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = 'Click again to erase all answers';
  setTimeout(function(){ if(btn.dataset.armed === '1'){ btn.dataset.armed = '0'; btn.classList.remove('armed'); btn.textContent = '↻ Restart worksheet'; } }, 4000);
}

$('restartBtn').onclick = restart;
window.addEventListener('resize', function(){ CARDS.forEach(function(c){ if(c.q.kind === 'graph'){ redraw(c); if(c.helpLevel === 2 && !c.hbox.hidden) drawAnswer(c); } }); });
buildSheet();
})();
</script>
